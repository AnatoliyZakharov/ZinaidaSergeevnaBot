name: Smoke tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # тест миграции БД читает db.py из коммита до PR

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet gspread requests google-auth pytz==2024.2
          # «Мои задачи»: реальные объекты Telegram и Fernet — тесты не пропускаются
          pip install --quiet python-telegram-bot==21.6 cryptography==43.0.3
          # проверка deploy.yml в test_deploy_monitor (явная метка DEPLOY_SHA)
          pip install --quiet pyyaml
          # issue #32: настоящий oauthlib — тест granular consent («Scope has changed»)
          pip install --quiet google-auth-oauthlib==1.2.1

      - name: Run smoke tests
        run: python test_smoke.py
        env:
          MYMEET_TOKEN: ""
          MYMEET_WS_ID: ""
          MYMEET_SPREADSHEET_ID: ""
          ORGANIZER_EMAIL: ""
          GOOGLE_SA_KEY: "{}"

  docker-packaging:
    # Полнота Docker-образа (issue #29): все локальные модули, нужные entrypoint,
    # попадают в образ; образ собирается и модули импортируются внутри него.
    # Имя job — required check для branch protection на main.
    name: Docker packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static packaging check (Dockerfile COPY vs imports)
        run: python ci/check_docker_packaging.py

      - name: Build image and smoke-test imports
        run: bash ci/docker_import_smoke.sh
