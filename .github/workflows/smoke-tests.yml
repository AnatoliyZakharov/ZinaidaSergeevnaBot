name: Smoke tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet gspread requests google-auth
          # «Мои задачи»: реальные объекты Telegram и Fernet — тесты не пропускаются
          pip install --quiet python-telegram-bot==21.6 cryptography==43.0.3

      - name: Run smoke tests
        run: python test_smoke.py
        env:
          MYMEET_TOKEN: ""
          MYMEET_WS_ID: ""
          MYMEET_SPREADSHEET_ID: ""
          ORGANIZER_EMAIL: ""
          GOOGLE_SA_KEY: "{}"
